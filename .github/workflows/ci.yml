name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Connection string for the throwaway Postgres the DB suites run against. It matches
# docker-compose.yml so CI and a laptop exercise the same schema the same way, and the
# host is `localhost`, which is what `lib/db/__tests__/testDatabase.ts` requires.
env:
  TEST_DB_URL: postgresql://strideiq:strideiq@localhost:5432/strideiq

jobs:
  build:
    runs-on: ubuntu-latest
    # Ten suites under lib/db round-trip real SQL and were skipping in CI for want of
    # a database, so migrations, upserts, forecast logs and athlete memory went
    # unverified on every PR. postgres:17 matches docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strideiq
          POSTGRES_PASSWORD: strideiq
          POSTGRES_DB: strideiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strideiq -d strideiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Called directly rather than through `npm run db:migrate`, which loads
      # `.env.local` — absent in CI today, but this way the migration target cannot
      # be changed by a file appearing later. DATABASE_URL is scoped to this step
      # alone: the suites reach their database only via the guarded TEST_DATABASE_URL,
      # and leaving DATABASE_URL set job-wide would hand them a second, ungated route.
      - name: Migrate the test database
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}

      # Typecheck + lint + unit tests. Tests that depend on the git-ignored
      # Strava export fixture self-skip when it's absent (i.e. in CI).
      - run: npm run check
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB_URL }}

      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    # Same database as `build`. Without it the report showed lib/db as essentially
    # uncovered, which understated a tested layer rather than merely omitting it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strideiq
          POSTGRES_PASSWORD: strideiq
          POSTGRES_DB: strideiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strideiq -d strideiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate the test database
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
      # Enforces the floors in vitest.config.ts, which are set a few points under the
      # suite's real coverage. A failure here means coverage dropped, not that it is low.
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB_URL }}

  # The FastAPI service (backend/) and the contract between it and the Next app. Its own
  # job so a Python failure reads as one, and so it adds checks without touching the
  # existing jobs. Node is here only for `api:check`, which regenerates the TypeScript
  # client from the backend's OpenAPI and fails if the committed copy is stale.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --locked: fail if backend/uv.lock is out of date rather than re-resolving.
      - run: uv sync --locked --directory backend
      - run: npm run backend:check
      - run: npm run api:check

  # Runs the suite as if it were a year from now. Three suites have turned `main` red
  # purely because time passed, each found only when it broke; this catches the next
  # one at authoring time instead. Cheap: same suite, one env var.
  #
  # Deliberately no database: this job exists to find date-rot in analytics, and the DB
  # suites write rows stamped with the displaced clock, which would add failures that
  # say nothing about the thing being probed.
  time-travel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:time-travel
